name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Pull data with DVC
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          f1=$(python -c 'import json; print(json.load(open("outputs/report.json"))["f1_score"])')
          echo "f1=$f1" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          python - <<'PYEOF'
          import boto3
          s3 = boto3.client('s3')
          bucket = 'nmhtsme-bucket-d21'
          s3.upload_file('models/model.joblib', bucket, 'artifacts/current/model.joblib')
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import sys
          f1 = float('${{ needs.train.outputs.f1 }}')
          if f1 < 0.65:
              print(f"Quality gate failed: f1_score {f1} < 0.65")
              sys.exit(1)
          print(f"Quality gate passed: f1_score {f1} >= 0.65")
          PYEOF

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            pip3 install --user "scikit-learn==1.4.2" "joblib==1.4.2" "numpy==1.26.4" "scipy==1.15.3" "pandas==2.2.2" "fastapi==0.111.0" "uvicorn==0.29.0" boto3
            sudo systemctl restart income-api
            for i in $(seq 1 12); do
              if curl -sf http://localhost:8080/healthz; then exit 0; fi
              sleep 5
            done
            sudo systemctl status income-api --no-pager || true
            sudo journalctl -u income-api -n 50 --no-pager || true
            exit 1
